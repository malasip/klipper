# Creality Filament System (CFS) Configuration for Creality K2 Pro
# Upstream driver: https://github.com/gitstonelabs/creality-cfs-klipper

[creality_cfs]
serial_port: /dev/ttyS5
baud: 230400
timeout: 0.1
retry_count: 3
box_count: 4
auto_init: True
filament_sensor: toolhead_sensor
extrude_temp: 220
state_file: ~/printer_data/config/cfs_state.json

# Mechanical cutter geometry (K2 Pro stock cutter)
cut_switch_pin: nozzle_mcu:PB9
pre_cut_pos_x: 10.0
pre_cut_pos_y: 200.0
cut_pos_x: -10.0
cut_pos_x_min: -10.0
cut_pos_x_max: -6.5
cut_pos_y: 200.0
cut_velocity: 30000.0
cut_dwell: 0.150
cut_retries: 2
cut_step: 0.5
cut_retrude_len: 10.0
cut_retrude_velocity: 600.0
cut_relieve_len: 0.1

# Kinematic corridor & travel limits
safe_pos_x: 205.0
safe_pos_y: 301.0
chute_entry_x: 139.0
extrude_pos_x: 124.0
extrude_pos_y: 329.0
corridor_boundary_y: 285.0
travel_velocity: 12000.0
min_clearance_z: 5.0

# Toolhead unload pull parameters (35mm clears K2 Pro cutter blade through dual drive gears)
retrude_toolhead_pull_mm: 35.0
retrude_toolhead_pull_vel: 600.0

# Flush tuning
nozzle_volume: 108.0
buffer_empty_len: 30.0
flush_cycle_cap: 80.0
flush_default_len: 108.0
flush_velocity: 360.0
flush_post_retract_len: 2.0
flush_post_retract_vel: 600.0
nozzle_clean_macro: NOZZLE_CLEAN

# Include CFS toolchange macros
[include cfs_macros.cfg]