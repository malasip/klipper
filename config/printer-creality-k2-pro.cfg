# Creality K2 Pro Mainline Klipper Configuration
#
# Hardware:
# - Mainboard MCU: GD32F303RET6 (connected to host via /dev/ttyS2 @ 230400)
# - Toolhead MCU: GD32F303CBT6 (connected to host via /dev/ttyS3 @ 230400)
# - Host: Allwinner T113-i (ARM Cortex-A7) running Linux
# - Kinematics: CoreXY (300x300x300mm build volume)
# - Steppers: Closed-loop servo steppers driven via standard Step/Dir pulses
# - Z Probe: Nozzle load cell driven by CS1237 24-bit ADC via [load_cell_probe]
# - Accelerometer: LIS2DW on toolhead (SPI)
# - Multi-Material: Creality Filament System (CFS) via RS-485 (/dev/ttyS5)

[include k2-macros.cfg]
[include generic-creality-k2-cfs.cfg]

# ====================================================================
# MCU Definitions
# ====================================================================

[mcu]
serial: /dev/ttyS2
baud: 230400
restart_method: command

[mcu nozzle_mcu]
serial: /dev/ttyS3
baud: 230400
restart_method: command

[mcu host]
serial: /tmp/klipper_host_mcu

# ====================================================================
# Printer Kinematics & Limits
# ====================================================================

[printer]
kinematics: corexy
max_velocity: 800
max_accel: 20000
max_z_velocity: 15
max_z_accel: 300
square_corner_velocity: 10.0

[idle_timeout]
timeout: 1800

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[pause_resume]

[display_status]

[exclude_object]

[gcode_arcs]
resolution: 0.05

# ====================================================================
# Stepper Motors (Standard Step/Dir CoreXY)
# ====================================================================

[stepper_x]
step_pin: PB8
dir_pin: !PB7
enable_pin: !PA9
microsteps: 16
rotation_distance: 40
endstop_pin: PB11
position_min: -13
position_endstop: 302
position_max: 302
homing_speed: 80
homing_retract_dist: 5

[stepper_y]
step_pin: PB10
dir_pin: PB9
enable_pin: !PA8
microsteps: 16
rotation_distance: 40
endstop_pin: PB12
position_min: -6.5
position_endstop: -6.5
position_max: 332
homing_speed: 80
homing_retract_dist: 5

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PA10
microsteps: 16
rotation_distance: 8
gear_ratio: 64:20
endstop_pin: probe:z_virtual_endstop
position_min: -5.0
position_max: 303
homing_speed: 5
second_homing_speed: 2
homing_retract_dist: 3.0

[tmc2208 stepper_z]
uart_pin: PC1
run_current: 0.84
stealthchop_threshold: 0.2
sense_resistor: 0.100

# ====================================================================
# Extruder & Hotend (Toolhead MCU)
# ====================================================================

[thermistor my_thermistor]
temperature1: 25
resistance1: 98633
temperature2: 220
resistance2: 377
temperature3: 320
resistance3: 73

[extruder]
step_pin: nozzle_mcu:PB5
dir_pin: !nozzle_mcu:PB4
enable_pin: !nozzle_mcu:PB2
microsteps: 16
rotation_distance: 6.9
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: nozzle_mcu:PB8
sensor_type: my_thermistor
sensor_pin: nozzle_mcu:PA0
min_temp: 0
max_temp: 350
min_extrude_temp: 170
max_extrude_only_distance: 500.0
max_extrude_cross_section: 5.0
pressure_advance: 0.038
pressure_advance_smooth_time: 0.038
control: pid
pid_kp: 26.861
pid_ki: 3.035
pid_kd: 59.429

[verify_heater extruder]
check_gain_time: 30
heating_gain: 2.0
hysteresis: 5

[filament_switch_sensor toolhead_sensor]
pause_on_runout: False
switch_pin: ^!nozzle_mcu:PA11

[filament_switch_sensor cutter_sensor]
pause_on_runout: False
switch_pin: !nozzle_mcu:PB9

# ====================================================================
# Heated Bed
# ====================================================================

[thermistor custom_bed_thermistor]
temperature1: 25
resistance1: 100000
temperature2: 50
resistance2: 35884.2
temperature3: 100
resistance3: 6610.1

[heater_bed]
heater_pin: PC8
sensor_type: custom_bed_thermistor
sensor_pin: PC4
control: pid
pid_kp: 37.0
pid_ki: 0.18
pid_kd: 280.0
min_temp: 0
max_temp: 130

[verify_heater heater_bed]
check_gain_time: 60
heating_gain: 1.0
hysteresis: 5

# ====================================================================
# Chamber PTC Heater & Thermal Management
# ====================================================================

[heater_generic chamber_heater]
heater_pin: PC12
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
control: watermark
max_delta: 1.0
min_temp: 0
max_temp: 80

[verify_heater chamber_heater]
check_gain_time: 120
heating_gain: 1.0
hysteresis: 5

[temperature_sensor chamber_temp]
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
min_temp: 0
max_temp: 85

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
sensor_mcu: mcu

[temperature_sensor nozzle_mcu_temp]
sensor_type: temperature_mcu
sensor_mcu: nozzle_mcu

# ====================================================================
# Cooling & Chamber Fans
# ====================================================================

# Hotend Heatsink Fan (auto starts when hotend > 50C)
[heater_fan hotend_fan]
pin: nozzle_mcu:PB7
heater: extruder
heater_temp: 50.0

# Part Cooling Fan (CPAP / model cooling)
[fan]
pin: !nozzle_mcu:PB15
enable_pin: nozzle_mcu:PB6
cycle_time: 0.010
hardware_pwm: False

# Chamber PTC Circulation Fan
[heater_fan chamber_ptc_fan]
pin: !PB14
enable_pin: PB2
heater: chamber_heater
heater_temp: 35.0

# Chamber Exhaust / Carbon Filter Fan
[fan_generic filter_fan]
pin: PB1
cycle_time: 0.010

# Mainboard Cooling Fan
[output_pin board_fan]
pin: PA0
value: 1

# Chamber LED Lighting
[output_pin chamber_led]
pin: PB0
value: 1

# ====================================================================
# Nozzle Load Cell Probing (Native CS1237 ADC)
# ====================================================================

[load_cell]
sensor_type: cs1237
sclk_pin: nozzle_mcu:PB13
dout_pin: nozzle_mcu:PB14
sample_rate: 1280
gain: 128

[load_cell_probe]
sensor_type: cs1237
trigger_force: 75.0
speed: 3.0
lift_speed: 5.0
z_offset: 0.0
samples: 2
samples_result: average
samples_tolerance: 0.05
samples_tolerance_retries: 3

# ====================================================================
# Bed Mesh Leveling
# ====================================================================

[bed_mesh]
speed: 100
horizontal_move_z: 3.0
mesh_min: 15, 15
mesh_max: 285, 285
probe_count: 7, 7
mesh_pps: 2, 2
algorithm: bicubic
bicubic_tension: 0.2
fade_start: 1.0
fade_end: 10.0

# ====================================================================
# Accelerometer & Resonance Testing (LIS2DW on Toolhead)
# ====================================================================

[lis2dw]
cs_pin: nozzle_mcu:PA4
spi_software_sclk_pin: nozzle_mcu:PA5
spi_software_mosi_pin: nozzle_mcu:PA7
spi_software_miso_pin: nozzle_mcu:PA6
axes_map: x, z, y

[resonance_tester]
accel_chip: lis2dw
probe_points: 150, 150, 150
min_freq: 10
max_freq: 130
accel_per_hz: 100

[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 50.8
shaper_type_y: mzv
shaper_freq_y: 23.6
