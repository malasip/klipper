# =============================================================================
# cfs_macros.cfg: Klipper macros for Creality Filament System (CFS)
# =============================================================================
#
# Include this file in printer.cfg with:
#   [include cfs_macros.cfg]
#
# TOPOLOGY (v1.4.0 -- this is the load-bearing fix over older versions of this
# file): a CFS is ONE controller on the RS485 bus (normally address 0x01 = BOX=1)
# with FOUR slots selected by a data-byte bitmask. Tools T0..T3 are SLOTS on that
# one controller (TOOL=0..3), NOT bus addresses. The old macros mapped T0->BOX=1,
# T1->BOX=2 etc., so on real hardware T1/T2/T3 addressed absent boxes and no-op'd.
# BOX= exists for multi-box DAISY-CHAINS (a second 4-slot unit at address 2) --
# a separate axis from tool slots; a chained setup has tools T0..T7 mapping to
# (BOX=1,TOOL=0..3) then (BOX=2,TOOL=0..3).
#
# Available G-code commands from the creality_cfs module:
#   CFS_INIT                       -- run the auto-addressing sequence
#   CFS_STATUS [BOX=<1-4>]         -- query box state (loaded/feeding + event channel)
#   CFS_VERSION [BOX=<1-4>]        -- query firmware version and serial number
#   CFS_FW_VERSION BOX=<1-4>       -- query 0xF0 firmware version string
#   CFS_LOAD TOOL=<0-15> [BOX=] [TEMP=]    -- full sensor-gated load to toolhead (alias: CFS_EXTRUDE)
#   CFS_UNLOAD [TOOL=<0-15>] [COLD=1]      -- full unload (alias: CFS_RETRUDE; auto-cuts if uncut)
#   CFS_CUT [PARK=1]                       -- mechanical cut ram via safe corridor (cold & instant)
#   CFS_FLUSH [LEN=|VOLUME=] [VELOCITY=]   -- hotend purge with clog watchdog
#   CFS_SET_MODE BOX=<1-4> ...     -- raw box-mode frames (diagnostic)
#   CFS_SET_PRELOAD BOX= MASK= ENABLE=<0|1>  -- arm/disarm pre-loading (wire-correct)
#   CFS_ADDR_TABLE                 -- print the address assignment table
#
# TEMPERATURE NOTE (mainline Klipper): every load/unload/flush/cut blocks on M109
# to the module's extrude_temp (default 220) first. Set TEMP= per-material from
# your slicer's tool-change gcode if you need a different melt temperature.
# =============================================================================


# -----------------------------------------------------------------------------
# CFS_INITIALIZE: run the full auto-addressing sequence
# -----------------------------------------------------------------------------
# Wraps CFS_INIT with logging. Run manually after powering on the CFS hub (the
# module also auto-runs this at klippy:ready unless auto_init is disabled).
#
# Usage: CFS_INITIALIZE
[gcode_macro CFS_INITIALIZE]
description: Discover and assign RS485 addresses to all connected CFS boxes
gcode:
    RESPOND MSG="CFS: starting auto-addressing sequence..."
    CFS_INIT
    RESPOND MSG="CFS: auto-addressing complete. Check console for online count."


# -----------------------------------------------------------------------------
# CFS_CHECK_STATUS: query GET_BOX_STATE for all boxes
# -----------------------------------------------------------------------------
# Usage: CFS_CHECK_STATUS
[gcode_macro CFS_CHECK_STATUS]
description: Query GET_BOX_STATE for all CFS boxes and report results
gcode:
    RESPOND MSG="CFS: querying box states..."
    CFS_STATUS
    RESPOND MSG="CFS: status query complete."


# -----------------------------------------------------------------------------
# CFS_GET_VERSIONS: query GET_VERSION_SN for all boxes
# -----------------------------------------------------------------------------
# Usage: CFS_GET_VERSIONS
[gcode_macro CFS_GET_VERSIONS]
description: Query GET_VERSION_SN from all CFS boxes and report firmware versions
gcode:
    RESPOND MSG="CFS: querying firmware versions..."
    CFS_VERSION
    RESPOND MSG="CFS: version query complete."


# -----------------------------------------------------------------------------
# CFS_PRINT_START: call at the beginning of a multi-color print
# -----------------------------------------------------------------------------
# Verifies the box is online and ARMS pre-loading (wire phase 0x00 -- the
# start-of-print arm the stock host sends). Add to your START_PRINT macro.
#
# Usage: CFS_PRINT_START
[gcode_macro CFS_PRINT_START]
description: Prepare CFS for printing: verify online and arm pre-loading
gcode:
    RESPOND MSG="CFS: preparing for print..."
    CFS_CHECK_STATUS
    CFS_SET_PRELOAD MASK=15 ENABLE=1
    RESPOND MSG="CFS: ready for multi-color print."


# -----------------------------------------------------------------------------
# CFS_PRINT_END: call at the end of a multi-color print
# -----------------------------------------------------------------------------
# Unloads the ACTIVE tool (if any) back into its slot and DISARMS pre-loading
# (wire phase 0x01 -- the end-of-print disarm).
#
# Usage: CFS_PRINT_END
[gcode_macro CFS_PRINT_END]
description: Post-print CFS cleanup: unload the active tool and disarm pre-loading
gcode:
    {% set active = printer["creality_cfs"].active_tool if "creality_cfs" in printer else -1 %}
    {% if active >= 0 %}
        RESPOND MSG="CFS: print end, unloading active tool T{active}..."
        CFS_RETRUDE TOOL={active}
    {% else %}
        RESPOND MSG="CFS: print end, no tool tracked as loaded."
    {% endif %}
    CFS_SET_PRELOAD MASK=15 ENABLE=0
    RESPOND MSG="CFS: ready for next print."


# -----------------------------------------------------------------------------
# CFS_ENABLE_PRELOAD / CFS_DISABLE_PRELOAD
# -----------------------------------------------------------------------------
# Pre-loading keeps the buffer tube staged for fast tool changes. ENABLE=1 arms
# (wire phase 0x00), ENABLE=0 disarms (phase 0x01) -- the module maps these to
# the correct wire bytes (v1.4.0 fixed an inversion here).
#
# Usage: CFS_ENABLE_PRELOAD / CFS_DISABLE_PRELOAD
[gcode_macro CFS_ENABLE_PRELOAD]
description: Arm pre-loading on all slots of all online CFS controllers
gcode:
    CFS_SET_PRELOAD MASK=15 ENABLE=1
    RESPOND MSG="CFS: pre-loading armed (all online boxes)."

[gcode_macro CFS_DISABLE_PRELOAD]
description: Disarm pre-loading on all slots of all online CFS controllers
gcode:
    CFS_SET_PRELOAD MASK=15 ENABLE=0
    RESPOND MSG="CFS: pre-loading disarmed (all online boxes)."


# =============================================================================
# Tool-change macros (T0 / T1 / T2 / T3)
# =============================================================================
#
# Called from slicer tool-change G-code (OrcaSlicer / SuperSlicer emit bare
# T0/T1/T2/T3). Each Tn selects SLOT n on the single CFS controller (BOX=1).
#
# Change sequence (the validated order from the reference implementation):
#   1. CUT the old filament at the toolhead (only if use_cut is enabled AND a
#      tool is currently loaded -- needs the cutter hardware + config).
#   2. CFS_RETRUDE the old tool: 0x11 START -> single E-15 pull -> FINISH,
#      complete when the toolhead filament switch clears.
#   3. CFS_EXTRUDE the new tool: sensor-gated feed until the switch trips.
#   4. CFS_FLUSH: purge the old color through the hotend (only if use_flush).
#
# Customize per-printer via the variables on _CFS_TOOL_CHANGE:
#   variable_use_cut:   1 if your printer has the filament cutter configured
#                       (cut_switch_pin + cut geometry in [creality_cfs]); else 0.
#                       WITHOUT a cutter you must ensure the filament tip is clean
#                       or the retract may jam at the 4-way splitter.
#   variable_use_flush: 1 to purge after each change (set your purge position
#                       in the slicer or a wrapper macro first); else 0.
#   variable_flush_volume: flush volume hint in mm^3 passed to CFS_FLUSH VOLUME=.
#
# Multi-box daisy-chains: duplicate these macros as T4..T7 with BOX=2.
# =============================================================================

[gcode_macro _CFS_TOOL_CHANGE]
description: Internal: switch to CFS slot TOOL or bypass slot. Called by dynamic T0..Tn.
variable_active_tool: -1
variable_use_cut: 1
variable_use_flush: 1
variable_flush_volume: 0
gcode:
    {% set target_raw = params.TOOL|int %}
    {% set tool_map = printer["creality_cfs"].tool_map if "creality_cfs" in printer else {} %}
    {% set target = tool_map.get(target_raw, tool_map.get(target_raw|string, target_raw))|int %}
    {% set bypass_idx = printer["creality_cfs"].bypass_tool|default(4) %}
    # The module's get_status() active_tool is the single source of truth (it also
    # tracks standalone CFS_EXTRUDE/CFS_RETRUDE calls this macro never sees); the
    # macro variable is only the fallback if the module object is unavailable.
    {% if "creality_cfs" in printer %}
        {% set prev = printer["creality_cfs"].active_tool %}
    {% else %}
        {% set prev = printer["gcode_macro _CFS_TOOL_CHANGE"].active_tool %}
    {% endif %}

    # Check print state and initial hotend target temp
    {% set is_printing = (printer.print_stats.state == 'printing') or (params.FORCE|default(0)|int == 1) %}
    {% set initial_target = printer.extruder.target|float %}

    # Check if filament is detected in toolhead
    {% set toolhead_loaded = true %}
    {% if 'filament_switch_sensor toolhead_sensor' in printer %}
        {% set toolhead_loaded = printer['filament_switch_sensor toolhead_sensor'].filament_detected %}
    {% endif %}

    # Slot metadata for same-material check
    {% set slots = printer["creality_cfs"].slots if "creality_cfs" in printer else {} %}
    {% set prev_str = prev|string %}
    {% set target_str = target|string %}
    {% set prev_mat = (slots[prev_str].material|default('')|string)|lower if prev_str in slots else '' %}
    {% set target_mat = (slots[target_str].material|default('')|string)|lower if target_str in slots else '' %}
    {% set prev_color = (slots[prev_str].color|default('')|string)|lower if prev_str in slots else '' %}
    {% set target_color = (slots[target_str].color|default('')|string)|lower if target_str in slots else '' %}
    {% set same_filament = (prev_mat != '') and (prev_mat == target_mat) and (prev_color != '') and (prev_color not in ['none', '-1']) and (prev_color == target_color) %}

    {% if target == bypass_idx %}
        RESPOND MSG="CFS: Switching to bypass slot (T{target} - External Spool Holder)..."
        {% set bypass_args = [] %}
        {% if params.MATERIAL is defined %}{% set _ = bypass_args.append("MATERIAL=" ~ params.MATERIAL) %}{% endif %}
        {% if params.TEMP is defined %}{% set _ = bypass_args.append("TEMP=" ~ params.TEMP) %}{% endif %}
        {% if params.COLOR is defined %}{% set _ = bypass_args.append("COLOR=" ~ params.COLOR) %}{% endif %}
        {% if params.VENDOR is defined %}{% set _ = bypass_args.append("VENDOR=" ~ params.VENDOR) %}{% endif %}
        CFS_BYPASS {bypass_args|join(" ")}
    {% elif prev == target and toolhead_loaded %}
        RESPOND MSG="CFS: tool T{target} already active and loaded, skipping change"
    {% else %}
        RESPOND MSG="CFS: tool change T{prev} -> T{target}"

        {% if prev >= 0 and toolhead_loaded %}
            {% if prev == bypass_idx %}
                RESPOND MSG="CFS: cutting external spool filament (T{prev})..."
                CFS_CUT
                RESPOND MSG="CFS: retracting external filament from extruder..."
                M83
                G1 E-35 F600
                M400
                PAUSE
                RESPOND TYPE=error MSG="CFS: External spool filament cut! Please pull filament clear of toolhead sensor, then RESUME to load T{target}."
            {% else %}
                {% if printer["gcode_macro _CFS_TOOL_CHANGE"].use_cut|int == 1 %}
                    RESPOND MSG="CFS: cutting T{prev}..."
                    CFS_CUT
                {% endif %}
                RESPOND MSG="CFS: unloading T{prev}..."
                CFS_RETRUDE TOOL={prev}
            {% endif %}
        {% endif %}

        # Position over purge chute via safe corridor
        CFS_MOVE_TO_EXTRUDE

        RESPOND MSG="CFS: loading T{target}..."
        CFS_EXTRUDE TOOL={target}

        # Flush decision: flush only when printing and changing materials/colors (or forced)
        {% if printer["gcode_macro _CFS_TOOL_CHANGE"].use_flush|int == 1 and is_printing and not same_filament %}
            {% set vol = printer["gcode_macro _CFS_TOOL_CHANGE"].flush_volume|int %}
            {% if vol > 0 %}
                CFS_FLUSH VOLUME={vol}
            {% else %}
                CFS_FLUSH
            {% endif %}
        {% else %}
            {% if same_filament %}
                RESPOND MSG="CFS: Same material and color ({target_mat} {target_color}) - skipping flush."
            {% elif not is_printing %}
                RESPOND MSG="CFS: Idle tool selection - loaded to toolhead sensor without flushing."
                {% if prev >= 0 and not same_filament and prev_mat != '' %}
                    RESPOND MSG="CFS: Note: switched from {prev_mat} to {target_mat}. Run CFS_FLUSH before printing if purging is desired."
                {% endif %}
            {% endif %}
        {% endif %}

        # If printer was cold before tool change and not printing, ensure heater stays off
        {% if initial_target <= 0.0 and not is_printing %}
            M104 S0
        {% endif %}

        # Clean nozzle after loading over the chute
        {% if 'gcode_macro NOZZLE_CLEAN' in printer %}
            NOZZLE_CLEAN
        {% endif %}

        SET_GCODE_VARIABLE MACRO=_CFS_TOOL_CHANGE VARIABLE=active_tool VALUE={target}
        RESPOND MSG="CFS: tool T{target} active"
    {% endif %}


# =============================================================================
# Tool-selection Macros (T0..T3 + Bypass)
# =============================================================================
# Standard Klipper tool macros for slicer compatibility and Mainsail/Fluidd UI
# discovery. Each macro delegates to _CFS_TOOL_CHANGE with full mapping support.
#
# By default, Creality CFS uses:
#   T0 -> Box 1 Slot A (Tool 0)
#   T1 -> Box 1 Slot B (Tool 1)
#   T2 -> Box 1 Slot C (Tool 2)
#   T3 -> Box 1 Slot D (Tool 3)
#   T4 -> External Spool Holder (Bypass Slot)
#   T_BYPASS -> Explicit alias for External Spool Holder
#
# For multi-box setups (daisy-chaining), see the commented T4..T15 macros below.
# =============================================================================

[gcode_macro T0]
description: Select CFS Box 1 Slot A (Tool 0)
gcode:
    _CFS_TOOL_CHANGE TOOL=0

[gcode_macro T1]
description: Select CFS Box 1 Slot B (Tool 1)
gcode:
    _CFS_TOOL_CHANGE TOOL=1

[gcode_macro T2]
description: Select CFS Box 1 Slot C (Tool 2)
gcode:
    _CFS_TOOL_CHANGE TOOL=2

[gcode_macro T3]
description: Select CFS Box 1 Slot D (Tool 3)
gcode:
    _CFS_TOOL_CHANGE TOOL=3

[gcode_macro T4]
description: Select CFS Bypass slot (External Spool Holder)
gcode:
    {% set bypass_idx = printer["creality_cfs"].bypass_tool|default(4) %}
    _CFS_TOOL_CHANGE TOOL={bypass_idx}

[gcode_macro T_BYPASS]
description: Select CFS Bypass slot alias (External Spool Holder)
gcode:
    {% set bypass_idx = printer["creality_cfs"].bypass_tool|default(4) %}
    _CFS_TOOL_CHANGE TOOL={bypass_idx}

# -----------------------------------------------------------------------------
# Multi-box Daisy-Chain Templates (Uncomment if using multiple CFS units)
# -----------------------------------------------------------------------------
# Box 2 (Slots 4-7):
# [gcode_macro T4]
# description: Select CFS Box 2 Slot A (Tool 4)
# gcode:
#     _CFS_TOOL_CHANGE TOOL=4
#
# [gcode_macro T5]
# description: Select CFS Box 2 Slot B (Tool 5)
# gcode:
#     _CFS_TOOL_CHANGE TOOL=5
#
# [gcode_macro T6]
# description: Select CFS Box 2 Slot C (Tool 6)
# gcode:
#     _CFS_TOOL_CHANGE TOOL=6
#
# [gcode_macro T7]
# description: Select CFS Box 2 Slot D (Tool 7)
# gcode:
#     _CFS_TOOL_CHANGE TOOL=7
#
# (When using 2 boxes, shift T4 bypass above to T8 or use T_BYPASS)


# =============================================================================
# Slicer tool-change macro (M8200) for Creality Print / OrcaSlicer
# =============================================================================
#
# Creality Print and OrcaSlicer in Creality multi-material mode emit M8200 stages:
#   M8200 P S[next]          -- prepare / pre-opt
#   M8200 C S0               -- mechanical filament cut
#   M8200 R I[pre] p0        -- retrude active filament back to CFS
#   M8200 L I[next] p1       -- extrude/load target filament to toolhead
#   M8200 W                  -- waste chute wipe/motion
#   M8200 F S[spd] L[len]    -- flush hotend
#   M8200 O S[next]          -- finalize / end-opt
#
# Parameter I maps to slot index: 0..3 -> T1A..T1D; 4..7 -> T2A..T2D, etc.
# =============================================================================

[gcode_macro M8200]
description: Creality multi-material tool-change dispatch macro
variable_tnn: ""
gcode:
    {% if params.P is defined %}
        # Pre-opt: lift Z and prepare for cut
        CR_BOX_PRE_OPT
    {% endif %}
    {% if params.C is defined %}
        # Cut: sever filament at toolhead
        CR_BOX_CUT
    {% endif %}
    {% if params.R is defined %}
        # Retrude: retract filament into CFS
        {% if params.E is defined %}
            CR_BOX_RETRUDE LENGTH={params.E|float}
        {% else %}
            CR_BOX_RETRUDE
        {% endif %}
    {% endif %}
    {% if params.L is defined %}
        # Extrude/Load: load filament slot specified by I (0=T1A, 1=T1B, ...)
        {% set I_raw = params.I|default(0)|int %}
        {% set tool_map = printer.creality_cfs.tool_map|default({}) %}
        {% set I_param = tool_map.get(I_raw, tool_map.get(I_raw|string, I_raw))|int %}
        {% if I_param == printer.creality_cfs.bypass_tool %}
            CFS_BYPASS
        {% else %}
            {% set addr = (I_param // 4 + 1)|int|string %}
            {% set num_map = ['A', 'B', 'C', 'D'] %}
            {% set num = (I_param % 4)|int %}
            {% set tnn = 'T' + addr + num_map[num] %}
            RESPOND MSG="CFS M8200: Loading {tnn} (mapped from {I_raw} to slot {I_param})"
            CR_BOX_EXTRUDE TNN={tnn}
            SET_GCODE_VARIABLE MACRO=M8200 VARIABLE=tnn VALUE='"{tnn}"'
            CR_BOX_WASTE
        {% endif %}
    {% endif %}
    {% if params.W is defined %}
        # Waste: wipe chute check/motion
        CR_BOX_WASTE
    {% endif %}
    {% if params.F is defined %}
        # Flush: purge old material through nozzle
        {% set cur_tnn = printer['gcode_macro M8200'].tnn %}
        {% set flen = params.L|default(0)|float %}
        {% set fspeed = params.S|default(360)|float %}
        {% if flen > 0 %}
            CR_BOX_FLUSH TNN={cur_tnn} LEN={flen} VELOCITY={fspeed}
        {% else %}
            CR_BOX_FLUSH TNN={cur_tnn}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=M8200 VARIABLE=tnn VALUE='""'
    {% endif %}
    {% if params.O is defined %}
        # End-opt: finalize tool change
        CR_BOX_END_OPT
    {% endif %}


# -----------------------------------------------------------------------------
# CR_BOX_* choreography macros (K2 Pro geometry defaults)
# -----------------------------------------------------------------------------

[gcode_macro CR_BOX_PRE_OPT]
description: Pre-toolchange movements: lift Z slightly
gcode:
    SAVE_GCODE_STATE NAME=CR_BOX_PRE_OPT_state
    G91
    G0 Z0.4 F600
    G90
    RESTORE_GCODE_STATE NAME=CR_BOX_PRE_OPT_state

[gcode_macro CR_BOX_CUT]
description: Cut filament at toolhead
gcode:
    CFS_CUT

[gcode_macro CR_BOX_RETRUDE]
description: Unload filament from toolhead
gcode:
    {% set tool_param = params.TOOL|default(params.SLOT|default(none)) %}
    {% set active = printer["creality_cfs"].active_tool if "creality_cfs" in printer else -1 %}
    {% if tool_param is not none %}
        CFS_RETRUDE {rawparams}
    {% elif active >= 0 %}
        CFS_RETRUDE TOOL={active} {rawparams}
    {% else %}
        RESPOND MSG="CFS: CR_BOX_RETRUDE with no active tool, attempting unload on tool 0"
        CFS_RETRUDE TOOL=0 {rawparams}
    {% endif %}

[gcode_macro CR_BOX_EXTRUDE]
description: Load filament slot (TNN=T1A..T4D or TOOL=0..15)
gcode:
    {% if params.TNN is defined %}
        {% set tnn = params.TNN|upper %}
        {% set box_num = tnn[1]|int if (tnn|length >= 2 and tnn[1] in '1234') else 1 %}
        {% set slot_letter = tnn[-1] %}
        {% set slot_idx = 0 %}
        {% if slot_letter == 'B' %}
            {% set slot_idx = 1 %}
        {% elif slot_letter == 'C' %}
            {% set slot_idx = 2 %}
        {% elif slot_letter == 'D' %}
            {% set slot_idx = 3 %}
        {% endif %}
        {% set tool_idx = (box_num - 1) * 4 + slot_idx %}
    {% else %}
        {% set tool_idx = params.TOOL|default(0)|int %}
    {% endif %}
    # Move to purge chute before feeding into toolhead
    CFS_MOVE_TO_EXTRUDE
    CFS_EXTRUDE TOOL={tool_idx}

[gcode_macro CR_BOX_WASTE]
description: Position over waste chute
gcode:
    CFS_MOVE_TO_EXTRUDE

[gcode_macro CR_BOX_FLUSH]
description: Purge hotend and clean nozzle
gcode:
    {% set flen = params.LEN|default(0)|float %}
    {% set fvel = params.VELOCITY|default(0)|float %}
    {% if flen > 0 %}
        CFS_FLUSH LEN={flen} VELOCITY={fvel}
    {% else %}
        CFS_FLUSH
    {% endif %}

[gcode_macro CR_BOX_END_OPT]
description: Finalize tool change and return to safe XY
gcode:
    CFS_MOVE_TO_SAFE


# =============================================================================
# Kinematic Corridor & Chute Navigation Macros
# =============================================================================
# Decoupled from creality_cfs.py so motion kinematics are printer-configurable
# and portable across different printer geometries.
# =============================================================================

[gcode_macro CFS_MOVE_TO_SAFE]
description: Safely move toolhead to standby safe corridor position
gcode:
    {% if 'gcode_macro SAFE_MOVE_FROM_CHUTE' in printer %}
        SAFE_MOVE_FROM_CHUTE
        {% set cfg = printer["gcode_macro _K2_VARS"] %}
        G90
        G1 X{cfg.safe_x} Y{cfg.safe_y} F{cfg.speed_travel}
    {% else %}
        {% set safe_x = printer["creality_cfs"].safe_pos_x|default(205.0) if "creality_cfs" in printer else 205.0 %}
        {% set safe_y = printer["creality_cfs"].safe_pos_y|default(301.0) if "creality_cfs" in printer else 301.0 %}
        G90
        G1 X{safe_x} Y{safe_y} F12000
    {% endif %}

[gcode_macro BOX_MOVE_TO_SAFE_POS]
description: Move toolhead to safe position (Creality parity alias)
gcode:
    CFS_MOVE_TO_SAFE

[gcode_macro CFS_MOVE_TO_EXTRUDE]
description: Safely navigate toolhead into the purge chute position
gcode:
    {% if 'gcode_macro SAFE_MOVE_TO_CHUTE' in printer %}
        SAFE_MOVE_TO_CHUTE
    {% else %}
        {% set chute_x = printer["creality_cfs"].extrude_pos_x|default(124.0) if "creality_cfs" in printer else 124.0 %}
        {% set chute_y = printer["creality_cfs"].extrude_pos_y|default(329.0) if "creality_cfs" in printer else 329.0 %}
        G90
        G1 X{chute_x} Y{chute_y} F12000
    {% endif %}

[gcode_macro BOX_GO_TO_EXTRUDE_POS]
description: Move toolhead to purge chute position (Creality parity alias)
gcode:
    CFS_MOVE_TO_EXTRUDE


# =============================================================================
# Creality Compatibility & Box Parity Wrappers (BOX_*)
# =============================================================================
# These macros provide seamless drop-in parity for Creality touchscreens,
# Creality Print, HelixScreen, and legacy box_wrapper callers, dispatching to
# clean, hardware-agnostic CFS_* driver primitives.
# =============================================================================

[gcode_macro BOX_ENABLE_AUTO_REFILL]
description: Enable or disable CFS auto-refill across slots (Creality parity alias)
gcode:
    CFS_ENABLE_AUTO_REFILL {rawparams}

[gcode_macro BOX_UPDATE_SAME_MATERIAL_LIST]
description: Update CFS same-material auto-refill groups (Creality parity alias)
gcode:
    CFS_UPDATE_SAME_MATERIAL_LIST {rawparams}

[gcode_macro BOX_CHECK_MATERIAL_REFILL]
description: Check CFS same-material refill candidate (Creality parity alias)
gcode:
    CFS_CHECK_MATERIAL_REFILL {rawparams}

[gcode_macro BOX_ERROR_CLEAR]
description: Clear latched CFS box error state (Creality parity alias)
gcode:
    CFS_ERROR_CLEAR {rawparams}

[gcode_macro BOX_SET_PRE_LOADING]
description: Arm or disarm CFS pre-loading (Creality parity alias)
gcode:
    CFS_SET_PRELOAD {rawparams}

[gcode_macro BOX_SET_CURRENT_BOX_IDLE_MODE]
description: Set CFS box to idle mode (Creality parity alias)
gcode:
    CFS_SET_IDLE_MODE {rawparams}

[gcode_macro BOX_INFO_REFRESH]
description: Refresh RFID tags and remaining filament lengths (Creality parity alias)
gcode:
    CFS_INFO_REFRESH {rawparams}

[gcode_macro BOX_GET_RFID]
description: Query RFID tags from CFS (Creality parity alias)
gcode:
    CFS_GET_RFID {rawparams}

[gcode_macro BOX_GET_REMAIN_LEN]
description: Query filament remaining lengths from CFS (Creality parity alias)
