#####################################################################
#           CREALITY K2 PRO - CENTRALIZED OPERATIONAL MACROS         #
#          Full Mainsail Parity + Dynamic Kinematic Variables       #
#####################################################################

# ===================================================================
# 0. CENTRAL VARIABLE CONFIGURATION
# ===================================================================
[gcode_macro _K2_VARS]
description: Centralized coordinates, speeds, and distances for K2 Pro
# --- Park & Chute Positions ---
variable_chute_x: 124.0                # Purge chute opening & flap deflect
variable_chute_y: 329.0
variable_chute_entry_x: 139.0          # Safe alignment X before entering chute in Y
variable_safe_x: 205.0                 # Standby safe corridor
variable_safe_y: 301.0
variable_corridor_boundary_y: 285.0    # Border between open bed and transition zone
variable_park_side_x: 292.0            # Stock side park (X: max_x - 10)
variable_park_side_y: 150.0            # Stock side park (Y: max_y / 2)
variable_park_mode: "side"             # "side" (stock default) or "chute"
variable_park_x: 292.0                 # Active pause/cancel park X
variable_park_y: 150.0                 # Active pause/cancel park Y
variable_first_layer_park_x: 302.0
variable_first_layer_park_y: 150.0
variable_park_z_hop: 10.0
variable_min_clearance_z: 5.0

# --- Cutter Kinematics ---
variable_cutter_pre_x: 10.0
variable_cutter_pre_y: 200.0
variable_cutter_strike_x: -10.0

# --- Nozzle Cleaning Geometry (Chute, Blade & Silicone Wiper) ---
variable_blade_left_x: 138.0
variable_blade_right_x: 149.0
variable_silicone_left_x: 157.0
variable_silicone_right_x: 167.0
variable_silicone_y: 327.0

# --- Bed Patch Wipe Coordinates ---
variable_patch_x_start: 168.0
variable_patch_x_end: 178.0
variable_patch_y: 306.0
variable_patch_wipe_z: 0.0
variable_patch_temp: 140.0

# --- Prime Line Coordinates ---
variable_prime_x_start: 10.0
variable_prime_y_start: 10.0
variable_prime_x_mid: 100.0
variable_prime_x_end: 110.0
variable_prime_z: 0.28

# --- Kinematic & Extrusion Speeds (mm/min) ---
variable_speed_travel: 12000
variable_speed_slow_travel: 6000
variable_speed_z: 1200
variable_speed_wipe: 3000
variable_speed_retract: 1500

# --- Retraction Distances (mm) ---
variable_retract_pause: 1.5
variable_retract_cancel: 2.0
variable_retract_end: 2.0

# --- Dynamic State Holders (Internal) ---
variable_saved_target_temp: 0.0
gcode:
    # Storage container only


# ===================================================================
# 0b. SAFE CHUTE CORRIDOR NAVIGATION HELPERS
# ===================================================================
[gcode_macro SAFE_MOVE_TO_CHUTE]
description: Navigate toolhead safely to the waste chute via the kinematic corridor
gcode:
    {% set cfg = printer["gcode_macro _K2_VARS"] %}
    {% set act_x = printer.toolhead.position.x|float %}
    {% set act_y = printer.toolhead.position.y|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    G90

    # 1. Z clearance lift if homed and too low
    {% if "z" in printer.toolhead.homed_axes and act_z < cfg.min_clearance_z %}
        G1 Z{cfg.min_clearance_z} F{cfg.speed_z}
    {% endif %}

    # 2. Enter via collision-free L-corridor
    {% if act_y > cfg.safe_y %}
        # Already inside rear gutter: slide directly to chute
        G1 X{cfg.chute_x} Y{cfg.chute_y} F{cfg.speed_travel}
    {% else %}
        # From bed/corridor: align X with chute entry on safe line first
        G1 X{cfg.chute_entry_x} F{cfg.speed_travel}
        G1 Y{cfg.safe_y} F{cfg.speed_travel}
        # Advance straight in Y into chute throat
        G1 Y{cfg.chute_y} F{cfg.speed_travel}
        # Lateral nudge to deflect chute flap
        G1 X{cfg.chute_x} F{cfg.speed_travel}
    {% endif %}
    M400

[gcode_macro SAFE_MOVE_FROM_CHUTE]
description: Exit waste chute safely into transition corridor before moving onto bed
gcode:
    {% set cfg = printer["gcode_macro _K2_VARS"] %}
    {% set act_x = printer.toolhead.position.x|float %}
    {% set act_y = printer.toolhead.position.y|float %}
    G90

    # If deep in gutter, slide laterally to clear flap and back out in Y
    {% if act_y > cfg.safe_y %}
        G1 X{cfg.chute_entry_x} F{cfg.speed_travel}
        G1 Y{cfg.safe_y} F{cfg.speed_travel}
        G1 Y{cfg.corridor_boundary_y} F{cfg.speed_travel}
    {% endif %}
    M400


# ===================================================================
# 1. PAUSE & RESUME (Full Mainsail Parity + Thermal Safeguards)
# ===================================================================
[gcode_macro PAUSE]
description: Pause print, store temperature/state, and park at configured coordinates
rename_existing: PAUSE_BASE
gcode:
    {% set cfg = printer["gcode_macro _K2_VARS"] %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}

    # Store target nozzle temperature in case idle timeout shuts off the heater
    SET_GCODE_VARIABLE MACRO=_K2_VARS VARIABLE=saved_target_temp VALUE={printer.extruder.target}

    # Calculate safe Z-hop within machine bounds
    {% if act_z < (max_z - cfg.park_z_hop) %}
        {% set z_safe = cfg.park_z_hop %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}

    # Save complete G-code state (coordinates, feedrates, extrusion modes)
    SAVE_GCODE_STATE NAME=PAUSE_state
    PAUSE_BASE

    # Retract filament slightly to prevent oozing
    G91
    {% if printer.extruder.can_extrude|lower == 'true' %}
        G1 E-{cfg.retract_pause} F{cfg.speed_retract}
    {% endif %}

    # Z-hop and move to configured park position
    G1 Z{z_safe} F{cfg.speed_z}
    G90
    {% if cfg.park_mode == "chute" %}
        SAFE_MOVE_TO_CHUTE
    {% else %}
        G1 X{cfg.park_side_x} Y{cfg.park_side_y} F{cfg.speed_travel}
    {% endif %}


[gcode_macro RESUME]
description: Reheat if cooled down, unretract, and restore exact print state
rename_existing: RESUME_BASE
gcode:
    {% set cfg = printer["gcode_macro _K2_VARS"] %}
    {% set prev_temp = cfg.saved_target_temp|float %}

    # Thermal Safeguard: Reheat nozzle if temp cooled during pause
    {% if prev_temp > 0 and printer.extruder.temperature < (prev_temp - 5) %}
        M118 Reheating hotend to {prev_temp}C before resuming...
        M109 S{prev_temp}
    {% endif %}

    # Exit chute corridor if paused over chute
    {% if cfg.park_mode == "chute" %}
        SAFE_MOVE_FROM_CHUTE
    {% endif %}

    # Unretract filament back into the melt zone
    {% if printer.extruder.can_extrude|lower == 'true' %}
        G91
        G1 E{cfg.retract_pause} F{cfg.speed_retract}
        G90
    {% endif %}

    # Restore exact position, speeds, and coordinate modes
    RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1 MOVE_SPEED={cfg.speed_travel / 60}
    RESUME_BASE


# ===================================================================
# 2. CANCEL PRINT
# ===================================================================
[gcode_macro CANCEL_PRINT]
description: Cancel print, disarm heaters and CFS, and park safely
rename_existing: CANCEL_PRINT_BASE
gcode:
    {% set cfg = printer["gcode_macro _K2_VARS"] %}
    
    TURN_OFF_HEATERS
    {% if 'heater_generic chamber_heater' in printer %}
        SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET=0
    {% endif %}
    CLEAR_PAUSE

    {% if "xyz" in printer.toolhead.homed_axes %}
        G91
        {% if printer.extruder.can_extrude|lower == 'true' %}
            G1 E-{cfg.retract_cancel} F{cfg.speed_retract}
        {% endif %}
        
        {% set max_z = printer.toolhead.axis_maximum.z|float %}
        {% set act_z = printer.toolhead.position.z|float %}
        {% if act_z < (max_z - cfg.park_z_hop) %}
            G1 Z{cfg.park_z_hop} F{cfg.speed_z}
        {% else %}
            G1 Z{max_z - act_z} F{cfg.speed_z}
        {% endif %}
        
        G90
        # Park safely based on configured mode
        {% if cfg.park_mode == "chute" %}
            SAFE_MOVE_TO_CHUTE
        {% else %}
            G1 X{cfg.park_side_x} Y{cfg.park_side_y} F{cfg.speed_travel}
        {% endif %}
    {% else %}
        M118 Printer not homed, skipping park move on cancel.
    {% endif %}

    M106 S0
    {% if 'creality_cfs' in printer %}
        CFS_SET_PRELOAD MASK=15 ENABLE=0
    {% endif %}
    M84
    CANCEL_PRINT_BASE


# ===================================================================
# 3. PRINT LIFECYCLE (START_PRINT & END_PRINT)
# ===================================================================
[gcode_macro START_PRINT]
description: Production slicer start sequence using centralized coordinates
gcode:
    {% set cfg = printer["gcode_macro _K2_VARS"] %}
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    {% set CHAMBER_TEMP = params.CHAMBER_TEMP|default(0)|float %}
    {% set INITIAL_TOOL = params.INITIAL_TOOL|default(0)|int %}

    # 1. Chamber heater setup if specified
    {% if CHAMBER_TEMP > 0 and 'heater_generic chamber_heater' in printer %}
        SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={CHAMBER_TEMP}
    {% endif %}

    # 2. Start warming bed (keep nozzle cold during bed warm-up)
    M140 S{BED_TEMP}
    G90

    # 3. Initial cold reference homing
    M118 Initial cold reference homing...
    G28

    # 4. Sync CFS bus and read spools early
    {% if 'creality_cfs' in printer %}
        CFS_INIT
    {% endif %}

    # 5. Wait for bed thermal expansion to stabilize
    M118 Waiting for bed to reach {BED_TEMP}C...
    M190 S{BED_TEMP}

    # 6. Heat nozzle to softening temp (140C takes ~10-15s with ceramic heater)
    M118 Warming nozzle to 140C for bed patch clean...
    M109 S{cfg.patch_temp}

    # 7. Clean nozzle tip on textured bed patch at 140C (Z=0.0)
    M118 Cleaning nozzle on bed patch...
    BED_PATCH_CLEAN TEMP={cfg.patch_temp}

    # 8. Precision Z re-homing with clean, bare-metal nozzle tip
    M118 Precision Z homing with clean nozzle...
    G28 Z

	# 9. Adaptive bed mesh calibration (probes strictly around sliced objects)
    M118 Generating adaptive bed mesh around print area...
    BED_MESH_CALIBRATE ADAPTIVE=1

    # 10. Travel over waste chute for final heatup and loading
    SAFE_MOVE_TO_CHUTE

    # 11. Final nozzle target temperature over chute
    M118 Heating nozzle to {EXTRUDER_TEMP}C...
    M109 S{EXTRUDER_TEMP}

    # 12. Load initial CFS tool or pause for manual feed
    {% if 'creality_cfs' in printer %}
        T{INITIAL_TOOL}
        {% if 'gcode_macro NOZZLE_CLEAN' in printer %}
            NOZZLE_CLEAN
        {% endif %}
    {% else %}
        {% set toolhead_loaded = true %}
        {% if 'filament_switch_sensor toolhead_sensor' in printer %}
            {% set toolhead_loaded = printer['filament_switch_sensor toolhead_sensor'].filament_detected %}
        {% endif %}
        {% if not toolhead_loaded %}
            M118 Toolhead filament empty! Please load filament and press RESUME.
            PAUSE
        {% endif %}
    {% endif %}

    # 13. Front Edge Prime Line
    SAFE_MOVE_FROM_CHUTE
    G1 Z{cfg.min_clearance_z} F{cfg.speed_z}
    G1 X{cfg.prime_x_start} Y{cfg.prime_y_start} F{cfg.speed_travel}
    G1 Z{cfg.prime_z} F{cfg.speed_z}
    G92 E0
    G1 X{cfg.prime_x_mid} E15 F1000
    G1 X{cfg.prime_x_end} E18 F1000
    G92 E0
    M118 Prime line complete. Starting print.


[gcode_macro END_PRINT]
description: Production slicer end print sequence
gcode:
    {% set cfg = printer["gcode_macro _K2_VARS"] %}

    TURN_OFF_HEATERS
    {% if 'heater_generic chamber_heater' in printer %}
        SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET=0
    {% endif %}

    {% if "xyz" in printer.toolhead.homed_axes %}
        G91
        {% if printer.extruder.can_extrude|lower == 'true' %}
            G1 E-{cfg.retract_end} F{cfg.speed_retract}
        {% endif %}

        {% set max_z = printer.toolhead.axis_maximum.z|float %}
        {% set act_z = printer.toolhead.position.z|float %}
        {% if act_z < (max_z - cfg.park_z_hop) %}
            G1 Z{cfg.park_z_hop} F{cfg.speed_z}
        {% else %}
            G1 Z{max_z - act_z} F{cfg.speed_z}
        {% endif %}

        G90
        # Park safely based on configured mode
        {% if cfg.park_mode == "chute" %}
            SAFE_MOVE_TO_CHUTE
        {% else %}
            G1 X{cfg.park_side_x} Y{cfg.park_side_y} F{cfg.speed_travel}
        {% endif %}

        # Lower bed to halfway for convenient print removal
        {% set final_z = printer.toolhead.position.z|float %}
        {% if final_z < (max_z / 2) %}
            G1 Z{(max_z / 2)} F{cfg.speed_z}
        {% endif %}
    {% endif %}

    M106 S0
    {% if 'creality_cfs' in printer %}
        CFS_SET_PRELOAD MASK=15 ENABLE=0
    {% endif %}
    M84


# ====================================================================
# 4. Nozzle Cleaning Choreography (K2 Pro Chute Flick & Silicone Wipe)
# ====================================================================

[gcode_macro NOZZLE_CLEAN]
description: Stock-style nozzle cleaning (chute flap flick, steel blade wipe, silicone circular scrub)
gcode:
    {% set cfg = printer["gcode_macro _K2_VARS"] %}
    SAVE_GCODE_STATE NAME=nozzle_clean_state
    G90

    # Ensure toolhead is safely navigated into the waste chute
    SAFE_MOVE_TO_CHUTE

    # 1. Flick chute flap (X: 124 <-> 149 at Y=329)
    {% for _ in range(3) %}
        G1 X124 Y{cfg.chute_y} F{cfg.speed_travel}
        G1 X149 Y{cfg.chute_y} F{cfg.speed_travel}
    {% endfor %}

    # 2. Horizontal flick across sheet-metal cutoff blade (X: 138 <-> 149 at Y=329)
    {% for _ in range(2) %}
        G1 X{cfg.blade_left_x} Y{cfg.chute_y} F{cfg.speed_travel}
        G1 X{cfg.blade_right_x} Y{cfg.chute_y} F{cfg.speed_travel}
    {% endfor %}

    # 3. Move onto silicone brush and scrub linearly (X: 157 <-> 167 at Y=327)
    G1 X{cfg.silicone_left_x} Y{cfg.silicone_y} F{cfg.speed_travel}
    {% for _ in range(4) %}
        G1 X{cfg.silicone_right_x} Y{cfg.silicone_y} F{cfg.speed_travel}
        G1 X{cfg.silicone_left_x} Y{cfg.silicone_y} F{cfg.speed_travel}
    {% endfor %}

    # 4. Circular scrub arcs (wire-verified G2/G3 circles)
    G1 X160 Y{cfg.silicone_y} F10000
    G2 I4 J0 P1 F10000
    G1 X170 Y{cfg.silicone_y} F10000
    G3 I-4 J0 P1 F10000

    # 5. Rapid horizontal dross shake (X: 160 <-> 133 at Y=329)
    {% for _ in range(3) %}
        G1 X160 Y{cfg.chute_y} F{cfg.speed_travel}
        G1 X133 Y{cfg.chute_y} F{cfg.speed_travel}
    {% endfor %}

    # 6. Exit chute safely into transition corridor
    SAFE_MOVE_FROM_CHUTE

    RESTORE_GCODE_STATE NAME=nozzle_clean_state

[gcode_macro CFS_CLEAN_NOZZLE]
description: Alias for NOZZLE_CLEAN
gcode:
    NOZZLE_CLEAN

[gcode_macro BOX_NOZZLE_CLEAN]
description: Alias for NOZZLE_CLEAN
gcode:
    NOZZLE_CLEAN


# ===================================================================
# 5. BED PATCH CLEANING & MANUAL FILAMENT CHANGE
# ===================================================================
[gcode_macro BED_PATCH_CLEAN]
description: Pre-calibration wipe against textured bed patch at rear
gcode:
    {% set cfg = printer["gcode_macro _K2_VARS"] %}
    {% set temp = params.TEMP|default(cfg.patch_temp)|float %}
    {% set wipe_z = params.WIPE_Z|default(cfg.patch_wipe_z)|float %}
    {% set passes = params.PASSES|default(3)|int %}

    SAVE_GCODE_STATE NAME=bed_patch_clean_state
    G90

    # Ensure homed
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    # Soften plastic without oozing
    M109 S{temp}

    # Safe Z clearance
    {% if printer.toolhead.position.z < cfg.min_clearance_z %}
        G1 Z{cfg.min_clearance_z} F{cfg.speed_z}
    {% endif %}

    # Travel above wipe patch
    G1 X{cfg.patch_x_start} Y{cfg.patch_y} F{cfg.speed_travel}

    # Lower to wipe height
    G1 Z{wipe_z} F600

    # Scrub passes
    {% for _ in range(passes) %}
        G1 X{cfg.patch_x_end} Y{cfg.patch_y} F{cfg.speed_wipe}
        G1 X{cfg.patch_x_start} Y{cfg.patch_y} F{cfg.speed_wipe}
    {% endfor %}

    # Lift safely
    G1 Z{cfg.min_clearance_z} F{cfg.speed_z}

    # Optional silicone sweep
    {% if 'gcode_macro NOZZLE_CLEAN' in printer %}
        NOZZLE_CLEAN
    {% endif %}

    RESTORE_GCODE_STATE NAME=bed_patch_clean_state

[gcode_macro M600]
description: Manual filament change hook
gcode:
    PAUSE
    {action_respond_info("M600: Filament change requested. Replace filament and click RESUME.")}

# ====================================================================
# External Spool Load / Unload Macros
# ====================================================================

[gcode_macro LOAD_FILAMENT]
description: Load filament from external spool holder (with auto pre-heat and purge)
gcode:
    {% set default_temp = 220 %}
    {% if 'creality_spool_rfid' in printer and printer['creality_spool_rfid'].active %}
        {% set default_temp = printer['creality_spool_rfid'].melt_temp %}
    {% endif %}
    {% set target_temp = params.TEMP|default(params.EXTRUDER_TEMP|default(default_temp))|int %}

    M118 LOAD_FILAMENT: Preheating nozzle to {target_temp} C...
    M104 S{target_temp}

    {% if printer.toolhead.homed_axes != "xyz" %}
        G28
    {% endif %}
    {% if 'gcode_macro CFS_MOVE_TO_EXTRUDE' in printer %}
        CFS_MOVE_TO_EXTRUDE
    {% elif 'gcode_macro BOX_GO_TO_EXTRUDE_POS' in printer %}
        BOX_GO_TO_EXTRUDE_POS
    {% endif %}

    M109 S{target_temp}

    M118 LOAD_FILAMENT: Extruding filament down waste chute...
    M83
    G1 E75 F300
    G4 P500
    G1 E20 F200
    M400

    {% if 'gcode_macro NOZZLE_CLEAN' in printer %}
        NOZZLE_CLEAN
    {% endif %}

    {% if 'gcode_macro CFS_MOVE_TO_SAFE' in printer %}
        CFS_MOVE_TO_SAFE
    {% endif %}
    M118 LOAD_FILAMENT: Completed successfully.

[gcode_macro UNLOAD_FILAMENT]
description: Unload filament from toolhead (auto-detects CFS vs external spool)
gcode:
    {% set default_temp = 220 %}
    {% if 'creality_spool_rfid' in printer and printer['creality_spool_rfid'].active %}
        {% set default_temp = printer['creality_spool_rfid'].melt_temp %}
    {% endif %}
    {% set target_temp = params.TEMP|default(params.EXTRUDER_TEMP|default(default_temp))|int %}
    {% set tool_param = params.TOOL|default(params.SLOT|default(none)) %}

    # Check if filament is in toolhead
    {% set toolhead_has_filament = true %}
    {% if 'filament_switch_sensor toolhead_sensor' in printer %}
        {% set toolhead_has_filament = printer['filament_switch_sensor toolhead_sensor'].filament_detected %}
    {% endif %}

    # Determine whether filament is from CFS or external spool
    {% set is_cfs = false %}
    {% set cfs_tool = -1 %}
    {% if 'creality_cfs' in printer and printer['creality_cfs'].is_connected %}
        {% set cfs = printer['creality_cfs'] %}
        {% set act = cfs.active_tool|int %}
        {% set bypass_active = cfs.bypass_active|default(false) %}
        {% set bypass_idx = cfs.bypass_tool|default(16)|int %}

        {% if tool_param is not none %}
            {% set cfs_tool = tool_param|int %}
            {% if cfs_tool != bypass_idx %}
                {% set is_cfs = true %}
            {% endif %}
        {% elif act >= 0 and act != bypass_idx and not bypass_active %}
            {% set is_cfs = true %}
            {% set cfs_tool = act %}
        {% elif not bypass_active and toolhead_has_filament %}
            # Filament in toolhead and bypass is not active -> loaded from CFS
            {% set is_cfs = true %}
            {% set cfs_tool = act if act >= 0 else 0 %}
        {% endif %}
    {% endif %}

    {% if is_cfs %}
        M118 UNLOAD_FILAMENT: Detected filament loaded from CFS (slot {cfs_tool}). Retruding to CFS box...
        CFS_UNLOAD TOOL={cfs_tool} TEMP={target_temp}
    {% else %}
        M118 UNLOAD_FILAMENT: Unloading from external spool holder...
        M118 UNLOAD_FILAMENT: Preheating nozzle to {target_temp} C...
        M104 S{target_temp}

        {% if printer.toolhead.homed_axes != "xyz" %}
            G28
        {% endif %}

        M109 S{target_temp}

        M118 UNLOAD_FILAMENT: Cutting filament tip...
        {% if 'gcode_macro CR_BOX_CUT' in printer %}
            CR_BOX_CUT
        {% elif 'creality_cfs' in printer or 'creality_spool_rfid' in printer %}
            CFS_CUT
        {% endif %}

        M118 UNLOAD_FILAMENT: Retracting from extruder gears...
        M83
        G1 E-35 F600
        M400

        {% if 'gcode_macro CFS_MOVE_TO_SAFE' in printer %}
            CFS_MOVE_TO_SAFE
        {% endif %}
        M118 UNLOAD_FILAMENT: Ready. Please pull remaining filament back onto spool.
    {% endif %}

# Creality compatibility aliases
[gcode_macro LOAD_MATERIAL]
description: Alias for LOAD_FILAMENT
gcode:
    LOAD_FILAMENT {rawparams}

[gcode_macro QUIT_MATERIAL]
description: Alias for UNLOAD_FILAMENT
gcode:
    UNLOAD_FILAMENT {rawparams}