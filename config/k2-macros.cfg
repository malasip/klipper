# Standard Clean Klipper Macros for Creality K2 Pro
#
# Free of vendor JSON encodings and compatible with standard Moonraker/Mainsail/Fluidd.

[gcode_macro START_PRINT]
description: Start print sequence
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    {% set CHAMBER_TEMP = params.CHAMBER_TEMP|default(0)|float %}

    M117 Preheating Bed...
    M140 S{BED_TEMP}
    M104 S150 ; Pre-warm hotend without oozing

    # Chamber pre-heating if requested
    {% if CHAMBER_TEMP > 0 %}
        M117 Heating Chamber to {CHAMBER_TEMP}C...
        SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET={CHAMBER_TEMP}
    {% endif %}

    M190 S{BED_TEMP} ; Wait for bed temp

    M117 Homing All Axes...
    G28

    M117 Calibrating Bed Mesh...
    BED_MESH_CALIBRATE

    M117 Final Heating...
    G1 X124 Y329 Z10 F12000 ; Move to purge zone
    M109 S{EXTRUDER_TEMP} ; Wait for hotend temp

    M117 Cleaning Nozzle...
    CFS_CLEAN_NOZZLE

    M117 Printing...

[gcode_macro END_PRINT]
description: End print sequence
gcode:
    SAVE_GCODE_STATE NAME=end_print_state
    M400 ; Wait for buffer to clear
    G91 ; Relative positioning
    G1 E-2 F2700 ; Retract filament
    G1 Z5 F3000 ; Lift nozzle
    G90 ; Absolute positioning
    G1 X10 Y300 F12000 ; Present bed / park toolhead
    
    # Turn off heaters
    TURN_OFF_HEATERS
    SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET=0
    M107 ; Turn off part cooling
    
    # Run carbon filter exhaust fan for 2 minutes to clear VOCs
    SET_FAN_SPEED FAN=filter_fan SPEED=1.0
    UPDATE_DELAYED_GCODE ID=turn_off_filter DURATION=120

    M84 ; Disable steppers
    RESTORE_GCODE_STATE NAME=end_print_state
    M117 Print Complete.

[delayed_gcode turn_off_filter]
gcode:
    SET_FAN_SPEED FAN=filter_fan SPEED=0.0

[gcode_macro CANCEL_PRINT]
description: Cancel current print
rename_existing: BASE_CANCEL_PRINT
gcode:
    TURN_OFF_HEATERS
    SET_HEATER_TEMPERATURE HEATER=chamber_heater TARGET=0
    CLEAR_PAUSE
    SDCARD_RESET_FILE
    G91
    G1 Z10 F3000
    G90
    G1 X10 Y300 F12000
    M84
    BASE_CANCEL_PRINT

[gcode_macro PAUSE]
description: Pause current print
rename_existing: BASE_PAUSE
gcode:
    {% set z = params.Z|default(10)|int %}
    SAVE_GCODE_STATE NAME=PAUSE_state
    BASE_PAUSE
    G91
    G1 Z{z} F900
    G90
    G1 X10 Y300 F12000

[gcode_macro RESUME]
description: Resume current print
rename_existing: BASE_RESUME
gcode:
    G91
    G1 E1 F1800
    G90
    RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1
    BASE_RESUME
