# Creality Filament System (CFS) Mainline Configuration & Macros
#
# Hardware:
# - Connects over RS-485 via /dev/ttyS5 at 230400 baud
# - Controlled by klippy/extras/creality_cfs.py (pure Python non-blocking driver)

[creality_cfs]
serial_port: /dev/ttyS5
baud: 230400
filament_sensor: toolhead_sensor
cutter_sensor: cutter_sensor

# ====================================================================
# Tool Change Macros (T0, T1, T2, T3)
# ====================================================================

[gcode_macro T0]
description: Select CFS Tool 0
gcode:
    CFS_CHANGE_TOOL TOOL=0

[gcode_macro T1]
description: Select CFS Tool 1
gcode:
    CFS_CHANGE_TOOL TOOL=1

[gcode_macro T2]
description: Select CFS Tool 2
gcode:
    CFS_CHANGE_TOOL TOOL=2

[gcode_macro T3]
description: Select CFS Tool 3
gcode:
    CFS_CHANGE_TOOL TOOL=3

# ====================================================================
# Toolhead Mechanical Cut, Purge & Wipe Choreography
# ====================================================================

[gcode_macro CFS_CUT_MATERIAL]
description: Mechanically engage toolhead filament cutter
gcode:
    SAVE_GCODE_STATE NAME=cfs_cut_state
    G90
    # Move to pre-cut position
    G1 X10 Y200 F12000
    # Ram lever to cut filament
    G1 X-6.5 Y200 F30000
    G4 P250
    # Back off
    G1 X10 Y200 F12000
    RESTORE_GCODE_STATE NAME=cfs_cut_state

[gcode_macro CFS_CLEAN_NOZZLE]
description: Wipe nozzle against silicone brush
gcode:
    SAVE_GCODE_STATE NAME=cfs_clean_state
    G90
    G1 X157 Y327 Z5 F12000
    G1 Z0.5 F3000
    # Rapid wipe back and forth across silicone brush (X: 157 to 167)
    {% for wipe in range(5) %}
        G1 X167 Y327 F12000
        G1 X157 Y327 F12000
    {% endfor %}
    G1 Z5 F3000
    RESTORE_GCODE_STATE NAME=cfs_clean_state

[gcode_macro CFS_PURGE_SLOT]
description: Purge old filament into waste chute
gcode:
    SAVE_GCODE_STATE NAME=cfs_purge_state
    G90
    # Move above waste chute
    G1 X124 Y329 Z10 F12000
    G91
    # Extrude purge length
    G1 E60 F360
    G4 P500
    # Retract slightly before moving out
    G1 E-1.5 F1800
    G90
    RESTORE_GCODE_STATE NAME=cfs_purge_state
    CFS_CLEAN_NOZZLE

[gcode_macro CFS_CHANGE_TOOL]
description: Complete tool change cycle
gcode:
    {% set target_tool = params.TOOL|default(0)|int %}
    M117 Switching to Tool {target_tool}...
    # 1. Cut old filament
    CFS_CUT_MATERIAL
    # 2. Command CFS driver to perform unload & reload
    CFS_SELECT_TOOL TOOL={target_tool}
    # 3. Purge new material and wipe nozzle
    CFS_PURGE_SLOT
    M117 Tool {target_tool} Ready.
