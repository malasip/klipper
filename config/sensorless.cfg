# Creality K2 Pro Sensorless Homing & Homing Override
#
# Handles CoreXY sensorless homing order (Y first, then X),
# safe backoff from physical hard stops to avoid stall detection deadlocks,
# and centers the toolhead for nozzle load cell Z-probing.

[force_move]
enable_force_move: true

[homing_override]
axes: xyz
gcode:
  {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}

  # 0. Safe Z lift before homing to clear parts or bed clamps (e.g. after power outage)
  {% if "z" in printer.toolhead.homed_axes %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% if act_z < 10.0 %}
      G91
      G1 Z{10.0 - act_z} F600
      G90
    {% endif %}
  {% else %}
    {% if 'gcode_button z_bottom_limit' not in printer or printer['gcode_button z_bottom_limit'].state != 'PRESSED' %}
      FORCE_MOVE STEPPER=stepper_z DISTANCE=10 VELOCITY=10
    {% endif %}
  {% endif %}

  # 1. Home Y first (CoreXY safety)
  {% if home_all or 'Y' in params or ('Z' in params and 'y' not in printer.toolhead.homed_axes) %}
    # If already homed and near bumper, back off first
    {% if "y" in printer.toolhead.homed_axes and printer.toolhead.position.y < 20 %}
      G91
      G1 Y25 F3600
      G90
    {% endif %}
    G28 Y
    G91
    G1 Y15 F3600    ; Immediate backoff
    G90
  {% endif %}

  # 2. Home X
  {% if home_all or 'X' in params or ('Z' in params and 'x' not in printer.toolhead.homed_axes) %}
    # If already homed and near bumper (X max is 302), back off first
    {% if "x" in printer.toolhead.homed_axes and printer.toolhead.position.x > 280 %}
      G91
      G1 X-25 F3600
      G90
    {% endif %}
    G28 X
    G91
    G1 X-15 F3600   ; Immediate backoff
    G90
  {% endif %}

  # 3. Home Z against nozzle probe at bed center
  {% if home_all or 'Z' in params %}
    G90
    G1 X150 Y150 F7200
    G28 Z
    G91
    G1 Z5 F600
    G90
  {% endif %}
